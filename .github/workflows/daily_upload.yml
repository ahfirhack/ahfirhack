name: YouTube Upload (Meta AI Only Every 6 Hours)

on:
  schedule:
    # Exactly every six hours: 00:13, 06:13, 12:13, 18:13 UTC.
    # Offset avoids GitHub cron congestion at the top of each hour.
    - cron: "13 */6 * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: Channel to process (scheduled runs always process all channels)
        required: true
        default: all
        type: choice
        options:
          - all
          - "1"
          - "2"
          - "3"
          - "4"
      meta_timeout_seconds:
        description: Max Meta render wait per individual scene (seconds)
        required: true
        default: "600"
        type: string

concurrency:
  group: youtube-automation-persistent-browser
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install ffmpeg, fonts, and virtual display
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            ffmpeg fonts-open-sans fonts-dejavu-core fonts-liberation xvfb

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install --upgrade google-api-python-client google-auth-httplib2 google-auth-oauthlib
          python -m playwright install chromium --with-deps

      - name: Restore Meta AI browser session
        env:
          META_AI_STORAGE_STATE_B64: ${{ secrets.META_AI_STORAGE_STATE_B64 }}
          META_AI_STORAGE_STATE_2_B64: ${{ secrets.META_AI_STORAGE_STATE_2_B64 }}
          META_AI_STORAGE_STATE_3_B64: ${{ secrets.META_AI_STORAGE_STATE_3_B64 }}
          META_AI_STORAGE_STATE_4_B64: ${{ secrets.META_AI_STORAGE_STATE_4_B64 }}
          META_AI_STORAGE_STATE_5_B64: ${{ secrets.META_AI_STORAGE_STATE_5_B64 }}
        run: |
          if [ -z "$META_AI_STORAGE_STATE_B64" ]; then
            echo "Missing META_AI_STORAGE_STATE_B64. Import your signed-in Chrome with switch_meta_account.py --from-open-chrome, then --publish-only --repo OWNER/REPO."
            exit 1
          fi
          restore_meta_session() {
            local encoded="$1"
            local destination="$2"
            [ -z "$encoded" ] && return 0
            printf '%s' "$encoded" | base64 --decode | gzip --decompress > "$destination"
          }
          restore_meta_session "$META_AI_STORAGE_STATE_B64" "$RUNNER_TEMP/meta-ai-account-1.json"
          restore_meta_session "$META_AI_STORAGE_STATE_2_B64" "$RUNNER_TEMP/meta-ai-account-2.json"
          restore_meta_session "$META_AI_STORAGE_STATE_3_B64" "$RUNNER_TEMP/meta-ai-account-3.json"
          restore_meta_session "$META_AI_STORAGE_STATE_4_B64" "$RUNNER_TEMP/meta-ai-account-4.json"
          restore_meta_session "$META_AI_STORAGE_STATE_5_B64" "$RUNNER_TEMP/meta-ai-account-5.json"
          python - <<'PY'
          import glob, json, os
          files = sorted(glob.glob(os.path.join(os.environ["RUNNER_TEMP"], "meta-ai-account-*.json")))
          for path in files:
              state = json.load(open(path, encoding="utf-8"))
              assert isinstance(state.get("cookies"), list), "Invalid Meta storage state"
          print(f"[MetaAI] Restored {len(files)} isolated account session(s); account 1 is primary")
          PY

      - name: Restore unfinished Meta AI video job
        uses: actions/cache/restore@v6
        with:
          path: meta_ai_jobs
          key: meta-ai-video-jobs-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            meta-ai-video-jobs-${{ runner.os }}-

      - name: Restore credentials
        run: |
          mkdir -p credentials
          printf '%s' "${{ secrets.CHANNEL1_SECRETS_B64 }}" | base64 --decode > credentials/channel1_secrets.json
          printf '%s' "${{ secrets.CHANNEL2_SECRETS_B64 }}" | base64 --decode > credentials/channel2_secrets.json
          printf '%s' "${{ secrets.CHANNEL3_SECRETS_B64 }}" | base64 --decode > credentials/channel3_secrets.json
          printf '%s' "${{ secrets.CHANNEL4_SECRETS_B64 }}" | base64 --decode > credentials/channel4_secrets.json

          # FIX: Create a generic secrets.json if your script specifically looks for that name
          cp credentials/channel1_secrets.json credentials/secrets.json

          printf '%s' "${{ secrets.CHANNEL1_TOKEN_B64 }}"   | base64 --decode > credentials/channel1_token.json
          printf '%s' "${{ secrets.CHANNEL2_TOKEN_B64 }}"   | base64 --decode > credentials/channel2_token.json
          printf '%s' "${{ secrets.CHANNEL3_TOKEN_B64 }}"   | base64 --decode > credentials/channel3_token.json
          printf '%s' "${{ secrets.CHANNEL4_TOKEN_B64 }}"   | base64 --decode > credentials/channel4_token.json

      - name: Ensure dedup and prompt-reserve state exists
        run: |
          [ -f used_videos.json ]  || echo '[]' > used_videos.json
          [ -f used_scripts.json ] || echo '[]' > used_scripts.json
          [ -f used_prompts.json ] || echo '[]' > used_prompts.json
          [ -f uploaded_titles.json ] || echo '{"version":1,"channels":{}}' > uploaded_titles.json
          python modules/prompt_reserve.py prompt_reserve_channel_1.sqlite3 channel_1
          python modules/prompt_reserve.py prompt_reserve_channel_2.sqlite3 channel_2
          python modules/prompt_reserve.py prompt_reserve.sqlite3 channel_3
          python modules/prompt_reserve.py prompt_reserve_channel_4.sqlite3 channel_4

      - name: Generate Meta-only Shorts with up to 3 parallel browser workers
        env:
          OPENAI_API_KEY:        ${{ secrets.OPENAI_API_KEY }}
          OPENAI_TEXT_MODEL:     ${{ vars.OPENAI_TEXT_MODEL || 'gpt-6-astra' }}
          REPLICATE_API_KEY:     ${{ secrets.REPLICATE_API_KEY }}
          REPLICATE_TEXT_MODEL:  ${{ vars.REPLICATE_TEXT_MODEL || 'meta/meta-llama-3-70b-instruct' }}
          NOVA_API_KEY:          ${{ secrets.NOVA_API_KEY }}
          GROQ_API_KEY:          ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY:    ${{ secrets.OPENROUTER_API_KEY }}
          CEREBRAS_API_KEY:      ${{ secrets.CEREBRAS_API_KEY }}
          HF_TOKEN:              ${{ secrets.HF_TOKEN }}
          AI_HORDE_API_KEY:      ${{ secrets.AI_HORDE_API_KEY }}
          MISTRAL_API_KEY:       ${{ secrets.MISTRAL_API_KEY }}
          COHERE_API_KEY:        ${{ secrets.COHERE_API_KEY }}
          NVIDIA_API_KEY:        ${{ secrets.NVIDIA_API_KEY }}
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_API_KEY:        ${{ secrets.GEMINI_API_KEY }}
          CLAUDE_API_KEY:        ${{ secrets.CLAUDE_API_KEY }}
          ANTHROPIC_API_KEY:     ${{ secrets.ANTHROPIC_API_KEY }}
          AMAZON_ACCESS_KEY:     ${{ secrets.AMAZON_ACCESS_KEY }}
          AMAZON_SECRET_KEY:     ${{ secrets.AMAZON_SECRET_KEY }}
          AMAZON_REGION:         ${{ secrets.AMAZON_REGION || 'us-east-1' }}

          META_AI_STORAGE_STATE_FILE: ${{ runner.temp }}/meta-ai-account-1.json
          META_AI_STORAGE_STATE_FILES: ${{ runner.temp }}/meta-ai-account-1.json,${{ runner.temp }}/meta-ai-account-2.json,${{ runner.temp }}/meta-ai-account-3.json,${{ runner.temp }}/meta-ai-account-4.json,${{ runner.temp }}/meta-ai-account-5.json
          META_AI_JOBS_DIR:      ${{ github.workspace }}/meta_ai_jobs
          META_AI_BROWSER_CHANNEL: chromium
          META_AI_HEADLESS: "false"
          META_AI_SURFACES: "create"
          META_CHANNEL_WORKERS: "3"
          # Reject gross resets; bridgeable Meta reframing is made frame-exact in assembly.
          META_MAX_HANDOFF_DELTA: "0.18"
          # Near-identical normalized scene video is never accepted twice.
          META_MAX_DUPLICATE_DELTA: "0.025"
          META_AI_TIMEOUT_SECONDS: ${{ inputs.meta_timeout_seconds || '600' }}
          META_AI_MAX_RETRIES: "3"
          AI_HORDE_ENABLED: "false"
          SELECTED_CHANNEL: ${{ inputs.channel || 'all' }}
        run: |
          python -c 'from config import CHANNELS; assert len(CHANNELS) == 4 and all(c.get("media_source") == "meta_ai_browser" and c.get("native_clip_audio") and not c.get("use_voice") and not c.get("use_music") for c in CHANNELS), "Meta-only configuration required"'
          args=(--once --workers 3)
          if [ "$SELECTED_CHANNEL" != "all" ]; then
            args+=(--channel "$SELECTED_CHANNEL")
          fi
          xvfb-run -a python -u main.py "${args[@]}"

      - name: Upload Meta AI diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: meta-ai-diagnostics-${{ github.run_id }}
          path: |
            meta_ai_jobs/**/debug/*.png
            meta_ai_jobs/**/manifest.json
            meta_ai_jobs/**/meta_prompts.txt
          if-no-files-found: ignore
          retention-days: 2

      - name: Save unfinished Meta AI video job
        if: always()
        uses: actions/cache/save@v6
        with:
          path: meta_ai_jobs
          key: meta-ai-video-jobs-${{ runner.os }}-${{ github.run_id }}

      - name: Commit dedup state
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add used_videos.json used_scripts.json used_prompts.json uploaded_titles.json \
            prompt_reserve.sqlite3 prompt_reserve_channel_1.sqlite3 \
            prompt_reserve_channel_2.sqlite3 prompt_reserve_channel_4.sqlite3 || true
          git diff --staged --quiet || git commit -m "chore: update dedup state [skip ci]"
          git push || true
