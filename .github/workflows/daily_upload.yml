name: Daily YouTube Upload (Every 8 Hours)

on:
  schedule:
    # Run every 8 hours: 0:00, 8:00, 16:00 UTC
    - cron: "0 */8 * * *"
  workflow_dispatch:

concurrency:
  group: youtube-automation-persistent-browser
  cancel-in-progress: false

jobs:
  upload:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 180

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install ffmpeg, fonts, and virtual display
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            ffmpeg fonts-open-sans fonts-dejavu-core fonts-liberation xvfb

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install --upgrade google-api-python-client google-auth-httplib2 google-auth-oauthlib
          python -m playwright install chromium --with-deps

      - name: Validate persistent Meta AI directories
        env:
          META_AI_CHROME_PROFILE_DIR: ${{ vars.META_AI_CHROME_PROFILE_DIR }}
          META_AI_JOBS_DIR: ${{ vars.META_AI_JOBS_DIR }}
        run: |
          if [ -z "$META_AI_CHROME_PROFILE_DIR" ] || [ -z "$META_AI_JOBS_DIR" ]; then
            echo "Set repository variables META_AI_CHROME_PROFILE_DIR and META_AI_JOBS_DIR to absolute persistent paths on this self-hosted runner."
            exit 1
          fi
          mkdir -p "$META_AI_CHROME_PROFILE_DIR" "$META_AI_JOBS_DIR"

      - name: Restore credentials
        run: |
          mkdir -p credentials
          printf '%s' "${{ secrets.CHANNEL1_SECRETS_B64 }}" | base64 --decode > credentials/channel1_secrets.json
          printf '%s' "${{ secrets.CHANNEL2_SECRETS_B64 }}" | base64 --decode > credentials/channel2_secrets.json
          printf '%s' "${{ secrets.CHANNEL3_SECRETS_B64 }}" | base64 --decode > credentials/channel3_secrets.json
          printf '%s' "${{ secrets.CHANNEL4_SECRETS_B64 }}" | base64 --decode > credentials/channel4_secrets.json

          # FIX: Create a generic secrets.json if your script specifically looks for that name
          cp credentials/channel1_secrets.json credentials/secrets.json

          printf '%s' "${{ secrets.CHANNEL1_TOKEN_B64 }}"   | base64 --decode > credentials/channel1_token.json
          printf '%s' "${{ secrets.CHANNEL2_TOKEN_B64 }}"   | base64 --decode > credentials/channel2_token.json
          printf '%s' "${{ secrets.CHANNEL3_TOKEN_B64 }}"   | base64 --decode > credentials/channel3_token.json
          printf '%s' "${{ secrets.CHANNEL4_TOKEN_B64 }}"   | base64 --decode > credentials/channel4_token.json

      - name: Ensure dedup state files exist
        run: |
          [ -f used_videos.json ]  || echo '[]' > used_videos.json
          [ -f used_scripts.json ] || echo '[]' > used_scripts.json

      - name: Run pipeline (8-hour schedule handled by GitHub Actions)
        env:
          NOVA_API_KEY:          ${{ secrets.NOVA_API_KEY }}
          GROQ_API_KEY:          ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY:        ${{ secrets.GEMINI_API_KEY }}
          CLAUDE_API_KEY:        ${{ secrets.CLAUDE_API_KEY }}
          ANTHROPIC_API_KEY:     ${{ secrets.ANTHROPIC_API_KEY }}
          AMAZON_ACCESS_KEY:     ${{ secrets.AMAZON_ACCESS_KEY }}
          AMAZON_SECRET_KEY:     ${{ secrets.AMAZON_SECRET_KEY }}
          AMAZON_REGION:         ${{ secrets.AMAZON_REGION || 'us-east-1' }}
          PEXELS_API_KEY:        ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY:       ${{ secrets.PIXABAY_API_KEY }}
          JAMENDO_CLIENT_ID:     ${{ secrets.JAMENDO_CLIENT_ID }}
          FREESOUND_API_KEY:     ${{ secrets.FREESOUND_API_KEY }}
          ELEVENLABS_API_KEY:    ${{ secrets.ELEVENLABS_API_KEY }}
          DEEPGRAM_API_KEY:      ${{ secrets.DEEPGRAM_API_KEY }}
          COVERR_API_KEY:        ${{ secrets.COVERR_API_KEY }}
          VIDEEZY_CLIENT_ID:     ${{ secrets.VIDEEZY_CLIENT_ID }}
          VIDEEZY_CLIENT_SECRET: ${{ secrets.VIDEEZY_CLIENT_SECRET }}
          YOUTUBE_API_KEY:       ${{ secrets.YOUTUBE_API_KEY }}
          META_AI_CHROME_PROFILE_DIR: ${{ vars.META_AI_CHROME_PROFILE_DIR }}
          META_AI_JOBS_DIR:      ${{ vars.META_AI_JOBS_DIR }}
          META_AI_CHARACTER_IMAGE: ${{ vars.META_AI_CHARACTER_IMAGE }}
          META_AI_BROWSER_CHANNEL: chromium
          META_AI_HEADLESS: "false"
          META_AI_TIMEOUT_SECONDS: "900"
        run: xvfb-run -a python main.py --once

      - name: Commit dedup state
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add used_videos.json used_scripts.json || true
          git diff --staged --quiet || git commit -m "chore: update dedup state [skip ci]"
          git push || true
