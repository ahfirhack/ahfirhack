name: OAuth Client Diagnostic

on:
  workflow_dispatch:

jobs:
  identify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Identify OAuth projects without exposing credentials
        env:
          CHANNEL1_SECRETS_B64: ${{ secrets.CHANNEL1_SECRETS_B64 }}
          CHANNEL2_SECRETS_B64: ${{ secrets.CHANNEL2_SECRETS_B64 }}
          CHANNEL3_SECRETS_B64: ${{ secrets.CHANNEL3_SECRETS_B64 }}
          CHANNEL4_SECRETS_B64: ${{ secrets.CHANNEL4_SECRETS_B64 }}
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import json
          import os

          for slot in range(1, 5):
              payload = json.loads(base64.b64decode(
                  os.environ[f"CHANNEL{slot}_SECRETS_B64"]
              ))
              config = payload.get("installed") or payload.get("web") or {}
              client_id = str(config.get("client_id") or "")
              project_id = str(config.get("project_id") or "")
              if not client_id or not project_id:
                  raise SystemExit(
                      f"Channel {slot} OAuth secret is missing project/client metadata"
                  )
              digest = hashlib.sha256(client_id.encode()).hexdigest()
              print(f"CHANNEL{slot}_OAUTH_PROJECT={project_id}")
              print(f"CHANNEL{slot}_CLIENT_SHA256={digest}")
              print(f"CHANNEL{slot}_CLIENT_SUFFIX={client_id[-32:]}")
          PY
